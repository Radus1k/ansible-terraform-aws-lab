---
# Deploy = one app container + one nginx container on a shared network.
# Every step is a declarative module, so a second run reports changed=0.

- name: Pull the container images
  community.docker.docker_image_pull:
    name: "{{ item }}"
    # 'not_present' => pull only when the tag is missing locally, so a
    # second run with pinned tags reports changed=0.
    pull: not_present
  loop:
    - "{{ app_image }}"
    - "{{ proxy_image }}"

- name: Create the shared application network
  community.docker.docker_network:
    name: "{{ app_network }}"
    state: present

- name: Run the application container
  community.docker.docker_container:
    name: "{{ app_name }}"
    image: "{{ app_image }}"
    state: started
    pull: false
    restart_policy: unless-stopped
    env: "{{ app_env | default({}) }}"
    networks:
      - name: "{{ app_network }}"
    networks_cli_compatible: true
    comparisons:
      networks: strict

- name: Ensure the nginx config directory exists on the host
  ansible.builtin.file:
    path: "{{ nginx_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the nginx site config
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_conf_dir }}/default.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Run the reverse-proxy container
  community.docker.docker_container:
    name: "{{ proxy_name }}"
    image: "{{ proxy_image }}"
    state: started
    pull: false
    restart_policy: unless-stopped
    published_ports:
      - "{{ proxy_listen_port }}:80"
    volumes:
      - "{{ nginx_conf_dir }}/default.conf:/etc/nginx/conf.d/default.conf:ro"
    networks:
      - name: "{{ app_network }}"
    networks_cli_compatible: true
    comparisons:
      networks: strict

- name: Apply any pending nginx reload before the play's smoke test
  ansible.builtin.meta: flush_handlers
