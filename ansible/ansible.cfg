[defaults]
inventory           = ./inventory/aws_ec2.yml
roles_path          = ./roles
# Fine for a lab. In production, pre-seed known_hosts with ssh-keyscan instead.
host_key_checking   = False
retry_files_enabled = False
result_format       = yaml
interpreter_python  = auto_silent
forks               = 10

[inventory]
# Be explicit about which inventory plugins may run.
enable_plugins = amazon.aws.aws_ec2, auto, yaml, ini
cache = True

[ssh_connection]
# Big speedup: fewer SSH round-trips per task
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
